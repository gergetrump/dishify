name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-smoketest:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run normalization smoke test (deterministic fallback)
        working-directory: backend
        run: |
          python - << 'PY'
          from app.services.normalization import normalize_ingredients

          result = normalize_ingredients(["tomatoes", "mozzarella cheese", "fresh basil"])
          expected = ["tomato", "mozzarella", "basil"]

          if result != expected:
              raise SystemExit(f"Smoke test failed. expected={expected} got={result}")

          print("Smoke test passed:", result)
          PY
