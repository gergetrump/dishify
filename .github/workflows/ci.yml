name: CI/Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  data-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Smoke test restriction rules
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          rules_path = Path("data/restriction_rules.json")
          rules = json.loads(rules_path.read_text())
          assert len(rules) > 0, "restriction_rules.json is empty"
          print(f"Loaded {len(rules)} restriction rules")
          PY

  web-client:
    name: Web Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  backend-contracts:
    name: Backend Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/shared/dishify-contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e .
          pip install pytest

      - name: Unit tests
        run: pytest tests/ -v
        env:
          RESTRICTION_RULES_PATH: ${{ github.workspace }}/data/restriction_rules.json

  backend-ranking:
    name: Backend Ranking
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/shared/dishify-ranking
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e ../dishify-contracts
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/ -v
        env:
          RESTRICTION_RULES_PATH: ${{ github.workspace }}/data/restriction_rules.json

  ios:
    name: iOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Unit tests
        run: |
          xcodebuild test \
            -project Dishify.xcodeproj \
            -scheme Dishify \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:DishifyTests

  data-pipeline:
    name: Data Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate restriction rules
        run: |
          python -c "
          import json
          from pathlib import Path
          rules = json.loads(Path('data/restriction_rules.json').read_text())
          assert len(rules) > 0, 'restriction_rules.json is empty'
          print(f'OK: {len(rules)} restriction rules')
          "
