name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Skip the heavy psycopg + mypy stack for CI; tests + lint only need this slice.
          python -m pip install \
            fastapi 'uvicorn[standard]' 'pydantic>=2' \
            'sqlalchemy>=2' 'qdrant-client>=1.7' \
            numpy tqdm python-dotenv httpx \
            'pytest>=8' 'pytest-asyncio>=0.23' 'ruff>=0.6'

      #- name: Lint (ruff)
      #  run: ruff check backend tests scripts

      #- name: Format check (ruff)
      #  run: ruff format --check backend tests scripts

      #- name: Unit + integration tests (no network)
      #  run: pytest

      - name: OpenRouter connectivity check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - << 'PY'
          import os
          import sys
          import httpx

          api_key = os.getenv("OPENROUTER_API_KEY")
          if not api_key:
            print("OPENROUTER_API_KEY not set; skipping connectivity check")
            sys.exit(0)

          url = "https://openrouter.ai/api/v1/models"
          headers = {"Authorization": f"Bearer {api_key}"}

          with httpx.Client(timeout=15) as client:
            response = client.get(url, headers=headers)

          if response.status_code != 200:
            raise SystemExit(f"OpenRouter check failed: {response.status_code} {response.text}")

          print("OpenRouter connectivity check passed")
          PY
