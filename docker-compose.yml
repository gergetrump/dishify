services:
  postgres:
    image: postgres:16
    container_name: dishify-postgres
    environment:
      POSTGRES_USER: dishify
      POSTGRES_PASSWORD: dishify
      POSTGRES_DB: dishify
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dishify"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: dishify-keycloak
    volumes:
      - ./keycloak/create-realm.sh:/opt/keycloak/create-realm.sh
      - ./keycloak/dishify-user-profile.json:/opt/keycloak/dishify-user-profile.json
    entrypoint: ["sh", "/opt/keycloak/create-realm.sh"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: dishify
      KC_DB_USERNAME: ${POSTGRES_USER:-dishify}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-dishify}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-secret}
      KEYCLOAK_BACKEND_SECRET: ${KEYCLOAK_BACKEND_SECRET:-backend-secret}
      KEYCLOAK_TEST_USER: ${KEYCLOAK_TEST_USER:-testuser}
      KEYCLOAK_TEST_EMAIL: ${KEYCLOAK_TEST_EMAIL:-test@dishify.com}
      KEYCLOAK_TEST_PASSWORD: ${KEYCLOAK_TEST_PASSWORD:-test-secret}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:9001}
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: dishify-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  retrieval:
    build:
      context: ./backend
      dockerfile: services/retrieval/Dockerfile
    container_name: dishify-retrieval
    env_file:
      - .env.secret
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: recipes_full
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  reasoning:
    build:
      context: ./backend
      dockerfile: services/reasoning/Dockerfile
    container_name: dishify-reasoning
    env_file:
      - .env.secret
    environment:
      ENABLE_LLM_REASONING: "true"
      RESTRICTION_RULES_PATH: /data/restriction_rules.json
      LLM_TIMEOUT_SECONDS: "120"
    volumes:
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  recommendation:
    build:
      context: ./backend
      dockerfile: services/recommendation/Dockerfile
    container_name: dishify-recommendation
    environment:
      RETRIEVAL_URL: http://retrieval:8002
      REASONING_URL: http://reasoning:8003
      ENABLE_LLM_REASONING: "true"
      RESTRICTION_RULES_PATH: /data/restriction_rules.json
      REQUEST_TIMEOUT_SECONDS: "150"
    volumes:
      - ./data:/data:ro
    depends_on:
      - retrieval
      - reasoning
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./backend
      dockerfile: services/gateway/Dockerfile
    container_name: dishify-gateway
    ports:
      - "8000:8000"
    environment:
      RECOMMENDATION_URL: http://recommendation:8001
      USER_URL: http://user:8004
      KEYCLOAK_URL: http://keycloak:9001
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:9001}
      KEYCLOAK_REALM: dishify
      DISABLE_AUTH: "false"
      RESTRICTION_RULES_PATH: /data/restriction_rules.json
      REQUEST_TIMEOUT_SECONDS: "180"
    volumes:
      - ./data:/data:ro
    depends_on:
      - recommendation
      - user
      - keycloak
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: dishify-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
    depends_on:
      - gateway
      - web-client

  web-client:
    build:
      context: ./web-client
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: dishify-web-client
    depends_on:
      - gateway

  user:
    build:
      context: ./backend
      dockerfile: services/user/Dockerfile
    container_name: dishify-user
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dishify}:${POSTGRES_PASSWORD:-dishify}@postgres:5432/dishify
      KEYCLOAK_URL: http://keycloak:9001
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:9001}
      KEYCLOAK_REALM: dishify
      KEYCLOAK_CLIENT_ID: dishify-backend
      KEYCLOAK_LOGIN_CLIENT_ID: dishify-api
      KEYCLOAK_LOGIN_CLIENT_SECRET: ${KEYCLOAK_BACKEND_SECRET:-backend-secret}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_BACKEND_SECRET:-backend-secret}
      KEYCLOAK_IOS_CLIENT_ID: dishify-ios
      KEYCLOAK_WEB_CLIENT_ID: dishify-web
      RESTRICTION_RULES_PATH: /data/restriction_rules.json
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  indexing-worker:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: services/indexing/Dockerfile
    container_name: dishify-indexing-worker
    env_file:
      - .env.secret
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: recipes_full
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    volumes:
      - ./data:/data:ro
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["--csv", "/data/dataset_10000_annotated.csv"]

volumes:
  postgres_data:
  qdrant_data:
  caddy_data:
  caddy_config:
