[project]
name = "dishify-ranking"
version = "0.1.0"
description = "Inventory re-ranking for Dishify recommendation pipeline"
requires-python = ">=3.12"
dependencies = ["dishify-contracts"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dishify_ranking*"]
