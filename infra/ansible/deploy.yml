---
- name: Deploy Dishify
  hosts: dishify
  vars:
    app_dir: /opt/dishify
    repo_url: "https://{{ gh_pat }}@github.com/gergetrump/dishify.git"
    repo_branch: "{{ branch | default('main') }}"

  tasks:
    - name: Install Docker prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Add Docker GPG key
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Clone or update repo
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: true

    - name: Write .env.secret
      copy:
        content: "{{ env_secret }}"
        dest: "{{ app_dir }}/.env.secret"
        mode: "0600"

    - name: Write .env
      copy:
        content: |
          DOMAIN={{ domain | default('http://' + server_ip) }}
          VITE_API_URL={{ domain | default('http://' + server_ip) }}
        dest: "{{ app_dir }}/.env"
        mode: "0644"

    - name: Build and start services
      shell: docker compose up -d --build --remove-orphans
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for gateway health
      uri:
        url: http://localhost:8000/health
        method: GET
        status_code: 200
      register: health
      retries: 30
      delay: 10
      until: health.status == 200

    - name: Check existing recipe index size
      uri:
        url: http://localhost:6333/collections/recipes_full
        method: GET
        status_code: [200, 404]
      register: qdrant_collection
      failed_when: false

    - name: Show manual data-management options
      debug:
        msg: |
          recipes_full: {{ 'found, ' + (qdrant_collection.json.result.points_count | default(0) | string) + ' points' if qdrant_collection.status == 200 else 'not found' }}.
          Indexing is not run automatically during deploy — manage it manually:

          1) To swap in a pre-built Qdrant dataset (e.g. a dump a teammate sent you):
               From your local machine:
                 infra/scripts/qdrant_swap.sh validate <path-to-qdrant_volume.tar.gz>
                 infra/scripts/qdrant_swap.sh promote   # after reviewing the validate output

               Or manually inside the server:
                 ssh -i ~/.ssh/dishify_deploy root@{{ server_ip }}
                 mkdir -p /root/qdrant_import && tar -xzf /root/qdrant_volume.tar.gz -C /root/qdrant_import
                 docker stop dishify-qdrant
                 mv /var/lib/docker/volumes/dishify_qdrant_data/_data /var/lib/docker/volumes/dishify_qdrant_data/_data.bak
                 mv /root/qdrant_import /var/lib/docker/volumes/dishify_qdrant_data/_data
                 docker start dishify-qdrant

          2) To (re)run the indexing worker against a CSV already sitting in ./data:
               ssh -i ~/.ssh/dishify_deploy root@{{ server_ip }}
               cd {{ app_dir }}
               docker compose run --rm indexing-worker --csv /data/<your-file>.csv --recreate
