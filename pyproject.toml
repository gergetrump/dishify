[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [
	".venv",
	"data",
	"notebooks",
	"backend/app/__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
	"E501",      # line length is enforced by formatter
	"E101",      # mixed indentation in docstrings (tabs + alignment)
	"E402",      # main.py needs load_dotenv() before app.* imports
	"PLR0913",   # too-many-arguments -- our orchestrator has many knobs on purpose
	"PLR2004",   # magic numbers -- the scoring weights are numeric on purpose
	"SIM117",    # nested with statements are clearer in the orchestrator
	"B008",      # FastAPI Depends() / Field() in defaults are idiomatic
	"PLR0912",   # branchy orchestrator is clearer than refactoring into helpers
	"PLR0915",   # ditto for statement count
	"UP007",     # `Union[X, Y]` typing -> `X | Y` -- we use both styles
	"PLC0415",   # lazy imports are intentional (optional deps, circular guards)
	"W191",      # tab indentation is intentional (project convention)
]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["backend"]
filterwarnings = [
	"ignore::DeprecationWarning:pydantic.*",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["backend/app", "scripts"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
disallow_untyped_defs = false
